name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  spm:
    name: SPM Build (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - platform: iOS_17
            runner: macOS-14
          - platform: visionOS_27
            runner: xcode-27
            xcode-version: '27'
      fail-fast: false
    steps:
      - name: Checkout Repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # ratchet:actions/checkout@v4
      - name: Select Xcode Version
        if: matrix.xcode-version
        run: sudo xcode-select -s /Applications/Xcode_${{ matrix.xcode-version }}.app
      - name: Prepare Simulator Runtimes
        run: Scripts/github/prepare-simulators.sh ${{ matrix.platform }}
      - name: Build
        run: Scripts/build.swift spm ${{ matrix.platform }}

  model-tests:
    name: Model Tests (macOS)
    runs-on: xcode-27
    steps:
      - name: Checkout Repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # ratchet:actions/checkout@v4
      - name: Swift Test
        run: swift test --package-path AccessibilitySnapshotModel

  validate-strings:
    name: Validate Localized Strings
    runs-on: xcode-27
    steps:
      - name: Checkout Repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # ratchet:actions/checkout@v4
      - name: Validate Localized Strings
        run: Scripts/ValidateLocalizedStrings.swift

  tuist-build:
    name: Tuist Build (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          # `demo` picks the host app variant: apps built with the iOS 27 SDK must adopt the scene life cycle, so
          # Xcode 27 legs test against the scene-based AccessibilitySnapshotDemoScenes host.
          - platform: iOS_17
            runner: macOS-14
            device: "iPhone 15 Pro"
            os: "17.5"
            demo: AccessibilitySnapshotDemo
          - platform: iOS_18
            runner: macOS-15
            device: "iPhone 16 Pro"
            os: "18.5"
            demo: AccessibilitySnapshotDemo
          - platform: iOS_27
            runner: xcode-27
            device: "iPhone 18 Pro"
            os: "27.0"
            xcode-version: '27'
            demo: AccessibilitySnapshotDemoScenes
      fail-fast: false
    steps:
      - name: Checkout Repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # ratchet:actions/checkout@v4
      - name: Install mise
        uses: jdx/mise-action@v2
        with:
          experimental: true
      - name: Select Xcode Version
        if: matrix.xcode-version
        run: sudo xcode-select -s /Applications/Xcode_${{ matrix.xcode-version }}.app
      - name: Prepare Simulator Runtimes
        run: Scripts/github/prepare-simulators.sh ${{ matrix.platform }}
      - name: Tuist Install
        run: tuist install --path Example
      - name: Tuist Generate
        run: tuist generate --path Example
      - name: Tuist Build
        run: tuist build --path Example
      - name: Tuist Test - en
        run: tuist test --path Example -d '${{ matrix.device }}' -o ${{ matrix.os }} --platform iOS --result-bundle-path TestResults-${{ matrix.os }}.xcresult "${{ matrix.demo }} (en)"
      - name: Tuist Test - AccessibilitySnapshotPreviews
        if: matrix.platform != 'iOS_17'
        run: xcodebuild test -workspace Example/AccessibilitySnapshot.xcworkspace -scheme AccessibilitySnapshotPreviewsDemo -destination 'platform=iOS Simulator,name=${{ matrix.device }},OS=${{ matrix.os }}' -resultBundlePath TestResults-SwiftUI-${{ matrix.os }}.xcresult
      - name: Zip Test Results
        if: failure()
        run: zip -r TestResults-${{ matrix.platform }}.zip TestResults-*.xcresult
      - name: Upload Results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # ratchet:actions/upload-artifact@v4
        if: failure()
        with:
          name: Test Results-(${{ matrix.platform }})
          path: TestResults-${{ matrix.platform }}.zip
      - name: Upload Reference Images
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # ratchet:actions/upload-artifact@v4
        if: failure()
        with:
          name: Reference Images-(${{ matrix.platform }})
          path: Example/SnapshotTests/ReferenceImages
